name: Build Chinese Android APK

on:
  push:
    branches: [codex/chinese-localization]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0'
      - name: Build and check
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease :app:lintRelease :app:testReleaseUnitTest --no-daemon --console=plain
      - name: Upload unsigned APK and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alpharemote-1.4-zh.1-build
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/reports/
          if-no-files-found: error
